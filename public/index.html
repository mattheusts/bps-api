<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BPS · Banco de Preços em Saúde</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Tela de login -->
  <div id="login" class="login" hidden>
    <form id="form-login" class="login-card">
      <h1>BPS</h1>
      <p class="muted">Banco de Preços em Saúde</p>
      <label>E-mail <input name="email" type="email" required autocomplete="username"></label>
      <label>Senha <input name="senha" type="password" required autocomplete="current-password"></label>
      <p id="login-erro" class="erro" hidden></p>
      <button type="submit" class="btn primario">Entrar</button>
    </form>
  </div>

  <!-- Aplicação -->
  <div id="app" class="app" hidden>
    <nav class="menu">
      <div class="marca">BPS</div>
      <div class="menu-grupo">Dashboards</div>
      <a href="#/mapa">Mapa</a>
      <a href="#/precos">Preço de referência</a>
      <a href="#/sobrepreco">Alerta de sobrepreço</a>
      <a href="#/mercado">Mercado e fornecedores</a>
      <div class="menu-grupo">Cadastros</div>
      <div id="menu-cadastros"></div>
      <div id="menu-importar"></div>
      <div class="menu-rodape">
        <div id="usuario-nome"></div>
        <button id="sair" class="btn-link">Sair</button>
      </div>
    </nav>
    <main id="conteudo" class="conteudo"></main>
  </div>

  <div id="modal" class="modal" hidden></div>
  <div id="aviso" class="aviso" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
